name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Placeholders: the tests never call DNAnexus or need real credentials
      DX_TOKEN: dummy
      VERITY_SECRET_KEY: dummy
      VERITY_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
